messages:
  encoding: UTF-8

datasource:
  url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
  username: ${SPRING_DATASOURCE_USERNAME:sa}
  password: ${SPRING_DATASOURCE_PASSWORD:}

sql:
  init:
    mode: always

h2:
  console:
    enabled: true
    path: /h2-console
    settings:
      webAllowOthers: true

jpa:
  open-in-view: false
  generate-ddl: false
  hibernate:
    ddl-auto: none
  show-sql: true

logging:
  level:
    ROOT: ERROR
    ru.otus.spring.controller: DEBUG
